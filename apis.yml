aid: gojek
name: GoJek
description: >-
  Gojek (PT Aplikasi Karya Anak Bangsa, part of GoTo Group) is Indonesia's
  on-demand super app, running ride hailing (GoRide, GoCar), food delivery
  (GoFood), parcel and logistics (GoSend, GoBox), shopping (GoMart, GoShop) and
  payments (GoPay) across Indonesia, Singapore and Vietnam. Its developer-facing
  surface is not the consumer app but the GoBiz Platform - the merchant
  operating system Gojek runs its restaurants and small businesses on - which
  publishes the GoBiz Partner Integration API at developer.gobiz.com. That REST
  API lets POS vendors, online-food aggregators and enterprise merchants link
  outlets, sync GoFood catalogs, accept/reject and mark orders ready, create
  SKU-level promotions, take QRIS payment transactions, pull MokaPOS reporting
  and subscribe to webhook notifications. It is OAuth 2.0 only - client
  credentials for direct merchant integrations and authorization code with
  OpenID Connect for facilitators - across sandbox (api.partner-sandbox.gobiz.co.id)
  and production (api.gobiz.co.id) environments. Gojek Engineering also runs a
  substantial open-source organisation at github.com/gojek (Heimdall, Courier,
  Ziggurat, Weaver, Darkroom, Clickstream).
