apis:
- name: GoBiz Partner Integration API
  description: >-
    The GoBiz Partner Integration API is Gojek's merchant-side REST API. It
    covers outlet information and outlet linking, GoFood catalog sync and
    out-of-stock updates, order acceptance / rejection / food-ready marking,
    SKU-level GoFood promotions, outlet properties, QRIS payment transaction
    creation and lookup, MokaPOS library and reporting reads, and notification
    (webhook) subscription management. All calls are Bearer-token authenticated
    with OAuth 2.0 tokens issued by the Gojek GoAuth server; every response uses
    a success/data/errors envelope.
  humanURL: https://developer.gobiz.com/docs/api/intro/
