note: >-
  Gojek publishes no plans, tiers or price list for the GoBiz Partner
  Integration API. Access is granted per partner: the developer portal routes
  every access request through a contact form
  (developer.gobiz.com/contact-us/?selection=for-developer), OAuth client
  credentials are "issued by Gojek", and the portal FAQ states that only the
  developer assigned using the owner's registered email in GoBiz may create an
  integration, and that going live requires Gojek to verify the integration via
  the same form. The commercial relationship that does exist is the merchant
  commission on GoFood orders, which is a merchant contract rather than an API
  plan and is not published on the developer portal.
